<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pertemuan 9 - Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const darkModeToggle = document.getElementById;
      });
    </script>
  </head>
  <body
    class="bg-gray-100 dark:bg-gray-900 dark:text-gray-200 flex items-center justify-center min-h-screen"
  >
    <div
      class="bg-white dark:bg-gray-800 shadow-md rounded-lg p-8 w-full max-w-sm"
    >
      <div class="flex justify-center mb-6">
        <img src="images/iconCode0.png" alt="Logo" class="h-16" />
      </div>
      <h2
        class="text-2xl font-bold text-gray-800 dark:text-gray-100 text-center mb-6"
      >
        Login
      </h2>
      <form action="#" method="post">
        <div class="mb-4">
          <label
            for="email"
            class="block text-gray-700 dark:text-gray-300 font-medium mb-2"
            >Email</label
          >
          <input
            type="email"
            id="email"
            name="email"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-700 dark:border-gray-600"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="mb-4">
          <label
            for="password"
            class="block text-gray-700 dark:text-gray-300 font-medium mb-2"
            >Password</label
          >
          <input
            type="password"
            id="password"
            name="password"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent dark:bg-gray-700 dark:border-gray-600"
            placeholder="Enter your password"
            required
          />
        </div>

        <div class="mb-4 flex items-center justify-between">
          <div>
            <input type="checkbox" id="remember" name="remember" class="mr-2" />
            <label
              for="remember"
              class="text-gray-600 dark:text-gray-400 text-sm"
              >Remember Me</label
            >
          </div>
          <a href="#" class="text-blue-500 text-sm hover:underline"
            >Forgot Password?</a
          >
        </div>

        <button
          type="submit"
          class="w-full bg-blue-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          Login
        </button>
      </form>

      <div class="flex justify-center gap-1 text-sm text-gray-600 dark:text-gray-400 mt-6">
        <p>Don't have an account?</p>
        <a href="#" class="text-blue-500 hover:underline">Sign up</a>
      </div>
    </div>

    <div class="absolute top-4 right-4 flex items-center">
        <label for="darkModeToggle" class="mr-2 text-gray-800 dark:text-gray-200">Dark Mode</label>
        <input type="checkbox" id="darkModeToggle" class="toggle-checkbox w-6 h-6 rounded-full focus:ring-2 focus:ring-blue-500">
    </div>
  </body>
</html>

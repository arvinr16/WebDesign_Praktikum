<!DOCTYPE html>
<html lang="en">

    <title>Web Design Interface - Pertemuan 12</title>

     <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">

    <link rel="stylesheet" href="style.css">

  <body>
    <!-- Section Header Start -->
    <section id="header">
      <nav class="navbar navbar-expand-lg navbar-light bg-light">

            <ul class="navbar-nav ms-auto">

              <li class="nav-item"><a class="nav-link" href="#">Categories</a></li>

              <li class="nav-item"><a class="nav-link" href="#">Blog</a></li>

            </ul>
          </div>
        </div>
      </nav>
    </section>
    <!-- Section Header End -->

    <!-- Section Hero Start -->
    <section class="hero-section">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-md-6">
            <h1 class="display-4">Find the Boundaries. Push Through</h1>

            <p>Starting at Rp.199.999</p>
            <a href="#" class="btn btn-primary">Show Now</a>
          </div>
          <div class="col-md-6">
            <img
              src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8cHJvZHVjdHN8ZW58MHx8MHx8fDA%3D"
              alt="img-hero"
            />
          </div>
        </div>
      </div>
    </section>
    <!-- Section Hero End -->

    <!-- Section Features Start -->
     <section class="py-5 bg-light"><!-- Lanjut Disini --></section>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
